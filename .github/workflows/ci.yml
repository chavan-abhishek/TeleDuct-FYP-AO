name: TeleDuct scaffolding checks
on:
  push:
  pull_request:
jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and unit test without NVIDIA hardware
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -p 'test_*.py' -v
